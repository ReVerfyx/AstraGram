name: Build release APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
      TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
      ANDROID_NDK_VERSION: 27.2.12479018

    steps:
      - name: Checkout AstraGram
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android dependencies
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager             "platform-tools"             "platforms;android-36"             "build-tools;36.0.0"             "ndk;27.2.12479018"             "cmake;3.22.1"

      - name: Prepare Telegram source
        run: |
          chmod +x scripts/*.sh
          ./scripts/bootstrap-telegram.sh
          ./scripts/inject-telegram-api.sh

      - name: Build release
        working-directory: vendor/telegram
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace :TMessagesProj_App:assembleAfatRelease

      - name: Collect APK
        run: |
          mkdir -p artifacts
          cp vendor/telegram/TMessagesProj_App/build/outputs/apk/afat/release/app.apk artifacts/AstraGram-release.apk
          sha256sum artifacts/AstraGram-release.apk | tee artifacts/SHA256SUMS.txt

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: AstraGram-release
          path: artifacts/*
          if-no-files-found: error
          retention-days: 14
