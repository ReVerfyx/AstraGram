name: Build release APK

on:
  push:
    branches: [main]
  workflow_dispatch:
  issues:
    types: [opened]

permissions:
  contents: read

jobs:
  release:
    if: github.event_name != 'issues' || github.event.issue.title == '[ci] build release'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
      TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
      GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout AstraGram
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Check release secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "$TELEGRAM_API_ID" || { echo "Missing TELEGRAM_API_ID" >&2; exit 1; }
          test -n "$TELEGRAM_API_HASH" || { echo "Missing TELEGRAM_API_HASH" >&2; exit 1; }
          test -n "$GOOGLE_SERVICES_JSON_BASE64" || { echo "Missing GOOGLE_SERVICES_JSON_BASE64" >&2; exit 1; }

      - name: Install Android dependencies
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -path '*/bin/sdkmanager' | sort -V | tail -1)"
          fi
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;27.2.12479018" "cmake;3.22.1"

      - name: Prepare Telegram source
        shell: bash
        run: |
          set -euo pipefail
          chmod +x scripts/*.sh
          ./scripts/bootstrap-telegram.sh
          ./scripts/inject-telegram-api.sh
          if [ -z "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "GOOGLE_SERVICES_JSON_BASE64 secret is required for release builds." >&2
            exit 1
          fi
          printf '%s' "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > vendor/telegram/TMessagesProj_App/google-services.json
          ./scripts/validate-astra-source.sh

      - name: Fast Java compile check
        working-directory: vendor/telegram
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace :TMessagesProj:compileReleaseJavaWithJavac

      - name: Build release
        working-directory: vendor/telegram
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace :TMessagesProj_App:assembleAfatRelease

      - name: Collect APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          cp vendor/telegram/TMessagesProj_App/build/outputs/apk/afat/release/app.apk artifacts/AstraGram-release.apk
          sha256sum artifacts/AstraGram-release.apk | tee artifacts/SHA256SUMS.txt

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: AstraGram-release
          path: artifacts/*
          if-no-files-found: error
          retention-days: 14
